# SonarCloud analysis configuration (C/C++ via build wrapper).
# The scan step in .github/workflows/build.yml consumes this file; analysis is
# limited to first-party code under source/ (the VST3 SDK fetched into
# build/_deps by CMake is excluded by sonar.sources).
sonar.host.url=https://sonarcloud.io
sonar.organization=radixhomework
sonar.projectKey=radixhomework_vst-audio-processor
sonar.sources=source
sonar.sourceEncoding=UTF-8
sonar.cfamily.build-wrapper-output=bw-output
