name: CodeQL

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: windows-2022
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: cpp

      # Explicit build (autobuild would have to guess); the VST3 SDK is
      # fetched by CMake FetchContent as usual.
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v143

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Analyze
        uses: github/codeql-action/analyze@v4.39.1
