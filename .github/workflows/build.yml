name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  windows:
    name: Windows build + VST3 validator
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The VST3 SDK is fetched by CMake FetchContent (pinned tag in
      # CMakeLists.txt); no submodules or extra setup needed.
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v143

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Run VST3 validator
        run: ./build/bin/Release/validator.exe "./build/VST3/Release/AudioProcessor.vst3"

      # Bundles are release material: only produced for tag pushes.
      - name: Upload plugin bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: AudioProcessor-${{ github.ref_name }}-windows-vst3
          path: build/VST3/Release/AudioProcessor.vst3
          if-no-files-found: error
